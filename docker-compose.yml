# Einstellungen bitte NICHT hier, sondern in .env ändern (Vorlage: .env.example).
# So bleiben sie bei ./update.sh erhalten.
services:
  abendkasse:
    image: ghcr.io/rhineworks-code/abendkasse:latest
    # build: .             # nur zum lokalen Selbstbauen statt Image
    container_name: abendkasse
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true      # darf vom Updater aktualisiert werden
      - com.centurylinklabs.watchtower.scope=abendkasse
    ports:
      - "${HOST_PORT:-8020}:8084"
    volumes:
      - ./data:/data        # Datenbank, Profilbilder, eigene Fragen (data/questions/*.json)
      - ${BACKUP_PATH:-./backups/auto}:/backups   # nächtliche Sicherung – z. B. auf die Synology (siehe README)
    environment:
      GAME_TZ: Europe/Berlin
      PUBLIC_URL: ${PUBLIC_URL:-}
      PAYOUT_HOUR: ${PAYOUT_HOUR:-20}
      OPEN_HOUR: ${OPEN_HOUR:-0}
      WEEK_DAYS: ${WEEK_DAYS:-7}
      QUESTIONS_PER_DAY: ${QUESTIONS_PER_DAY:-10}
      JOKERS_PER_DAY: ${JOKERS_PER_DAY:-1}
      MORNING_HOUR: ${MORNING_HOUR:-6}
      EXTRA_BEFORE_HOUR: ${EXTRA_BEFORE_HOUR:-15}
      EXTRA_QUESTIONS: ${EXTRA_QUESTIONS:-5}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:abendkasse@example.com}
      MAX_STAKE: ${MAX_STAKE:-30}
      STAKE_STEP: ${STAKE_STEP:-10}
      TEMPO_SECONDS: ${TEMPO_SECONDS:-10}
      TEMPO_BONUS: ${TEMPO_BONUS:-2}
      DUEL_POINTS: ${DUEL_POINTS:-20}
      REMINDER_HOUR: ${REMINDER_HOUR:-18}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-}
      UPDATE_URL: http://updater:8080
      POINTS_PER_CORRECT: ${POINTS_PER_CORRECT:-10}
      PERFECT_DAY_BONUS: ${PERFECT_DAY_BONUS:-20}
      WEEK_WIN_BONUS: ${WEEK_WIN_BONUS:-100}
      MAX_PLAYERS: ${MAX_PLAYERS:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}

  # Updater: zieht auf Knopfdruck in der App das neue Image und startet Abendkasse neu.
  # Nur er hat Zugriff auf Docker; nach außen ist er nicht erreichbar (kein Port).
  updater:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: abendkasse-updater
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --http-api-update --label-enable --scope abendkasse --cleanup
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATE_TOKEN:-}
      TZ: Europe/Berlin
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - com.centurylinklabs.watchtower.scope=abendkasse
